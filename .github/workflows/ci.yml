name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine suite runs with numpy and pytest ONLY -- no PySide6 anywhere on
  # the machine. That is the enforcement mechanism for SPEC 1's rule that layers
  # 1-4 stay Qt-free, and for NFR-18's requirement that nothing blocks Linux.
  engine:
    name: engine / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install engine dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "pytest>=8.0"

      - name: Assert Qt is absent
        shell: bash
        run: |
          if python -c "import PySide6" 2>/dev/null; then
            echo "PySide6 must not be installed for the engine job"; exit 1
          fi
          echo "ok: no Qt present"

      - name: Generate corpus
        run: python tools/gen_corpus.py --out tests/corpus

      - name: Run tests
        run: python -m pytest tests -q

      - name: Assert the GUI suite skipped rather than passing vacuously
        shell: bash
        run: |
          # A GUI test module that failed to skip would be reported as an error,
          # but one that silently collected nothing would look identical to
          # success. Check the skips are actually there.
          python -m pytest tests/ui -q -rs 2>&1 | tee ui.txt
          grep -q "SKIPPED" ui.txt || { echo "expected the GUI suite to skip"; exit 1; }
          echo "ok: GUI suite skipped with Qt absent"

  # The GUI suite. Qt present, offscreen platform, so the view's row arithmetic,
  # damage regions, selection, keyboard handling and drag-and-drop are all
  # exercised without a display. Deliberately a separate job: if this one is red
  # and `engine` is green, the fault is in layer 5 and nowhere else.
  gui:
    name: gui / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install with the gui extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "pytest>=8.0" "PySide6>=6.7"

      # Qt's offscreen platform still wants these on a bare Linux runner.
      - name: Install Qt's Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Generate corpus
        run: python tools/gen_corpus.py --out tests/corpus

      - name: Run the whole suite, GUI included
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check --diff .
        continue-on-error: true

  # Informational, not a gate. Shared runners vary by far more than any
  # meaningful regression, so the real performance gate is a local
  # `python tools/bench.py --gate`. This job exists to catch an order-of-
  # magnitude collapse and to keep a public record of the numbers.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "numpy>=2.0"
      - name: Benchmark
        run: |
          python tools/bench.py --chunk-mb 16 --reps 2 \
            --merge-rows 500000 --json bench-results/ci.json \
            --tolerance 0.60 | tee bench-results/ci.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench-results/

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
